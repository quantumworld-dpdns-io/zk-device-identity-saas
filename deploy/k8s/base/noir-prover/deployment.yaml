apiVersion: apps/v1
kind: Deployment
metadata:
  name: noir-prover
  namespace: zk-identity
  labels:
    app.kubernetes.io/name: noir-prover
    app.kubernetes.io/component: prover
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: noir-prover
      app.kubernetes.io/component: prover
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noir-prover
        app.kubernetes.io/component: prover
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: noir-prover
        image: zk-identity/noir-prover:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
