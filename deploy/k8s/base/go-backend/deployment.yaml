apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-backend
  namespace: zk-identity
  labels:
    app.kubernetes.io/name: go-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: go-backend
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-backend
        app.kubernetes.io/component: backend
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: go-backend
        image: zk-identity/go-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: GO_ENV
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: GO_ENV
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: zk-identity-secrets
              key: postgres-password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: REDIS_PORT
        - name: QDRANT_HOST
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: QDRANT_HOST
        - name: QDRANT_PORT
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: QDRANT_PORT
        - name: NOIR_PROVER_URL
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: NOIR_PROVER_URL
        - name: RISC0_PROVER_URL
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: RISC0_PROVER_URL
        - name: JULIA_ANALYSIS_URL
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: JULIA_ANALYSIS_URL
        - name: AGENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: AGENT_SERVICE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: zk-identity-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
