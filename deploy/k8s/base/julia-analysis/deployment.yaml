apiVersion: apps/v1
kind: Deployment
metadata:
  name: julia-analysis
  namespace: zk-identity
  labels:
    app.kubernetes.io/name: julia-analysis
    app.kubernetes.io/component: analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: julia-analysis
      app.kubernetes.io/component: analysis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: julia-analysis
        app.kubernetes.io/component: analysis
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: julia-analysis
        image: zk-identity/julia-analysis:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8090
          name: http
          protocol: TCP
        env:
        - name: GO_BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: GO_BACKEND_URL
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 20
          periodSeconds: 20
