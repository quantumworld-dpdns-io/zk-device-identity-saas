apiVersion: v1
kind: Service
metadata:
  name: rust-proxy
  namespace: zk-identity
  labels:
    app.kubernetes.io/name: rust-proxy
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  ports:
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: admin
  selector:
    app.kubernetes.io/name: rust-proxy
    app.kubernetes.io/component: proxy
