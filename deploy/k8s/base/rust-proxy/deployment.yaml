apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-proxy
  namespace: zk-identity
  labels:
    app.kubernetes.io/name: rust-proxy
    app.kubernetes.io/component: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-proxy
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-proxy
        app.kubernetes.io/component: proxy
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: rust-proxy
        image: zk-identity/rust-proxy:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 443
          name: https
          protocol: TCP
        - containerPort: 8081
          name: admin
          protocol: TCP
        env:
        - name: PROXY_PORT
          value: "443"
        - name: GO_BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: GO_BACKEND_URL
        - name: REDIS_URL
          value: "redis://zk-identity-redis-master:6379"
        - name: RUST_LOG
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: RUST_LOG
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: zk-identity-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: tls
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: tls
        secret:
          secretName: rust-proxy-tls
