apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: zk-identity
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
        app.kubernetes.io/component: agent
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: agent-service
        image: zk-identity/agent-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: GO_BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: GO_BACKEND_URL
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
