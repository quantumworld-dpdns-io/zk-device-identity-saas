apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: zk-identity
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/component: mcp
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: mcp-server
        image: zk-identity/mcp-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3003
          name: http
          protocol: TCP
        env:
        - name: GO_BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: zk-identity-config
              key: GO_BACKEND_URL
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 15
