apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zk-identity

bases:
- ../../base

namePrefix: staging-

commonLabels:
  environment: staging
  app.kubernetes.io/environment: staging

patchesStrategicMerge:
- ingress.yaml

images:
- name: zk-identity/go-backend
  newTag: staging
- name: zk-identity/rust-proxy
  newTag: staging
- name: zk-identity/frontend
  newTag: staging
- name: zk-identity/julia-analysis
  newTag: staging
- name: zk-identity/risc-zero-prover
  newTag: staging
- name: zk-identity/noir-prover
  newTag: staging
- name: zk-identity/agent-service
  newTag: staging
- name: zk-identity/mcp-server
  newTag: staging

patches:
- target:
    kind: Deployment
    name: go-backend
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 128Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 250m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 256Mi
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: RUST_LOG
        value: debug
- target:
    kind: Deployment
    name: rust-proxy
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 128Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 250m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 256Mi
    - op: replace
      path: /spec/template/spec/containers/0/env/2/value
      value: debug
- target:
    kind: Deployment
    name: frontend
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 50m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 64Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 150m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 128Mi
- target:
    kind: Deployment
    name: julia-analysis
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 250m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 512Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 2Gi
- target:
    kind: Deployment
    name: risc-zero-prover
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 500m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 1Gi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 4Gi
- target:
    kind: Deployment
    name: noir-prover
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 250m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 512Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 2Gi
- target:
    kind: Deployment
    name: agent-service
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 128Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 250m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 256Mi
- target:
    kind: Deployment
    name: mcp-server
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 128Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 250m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 256Mi
