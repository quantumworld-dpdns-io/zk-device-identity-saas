apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zk-identity

bases:
- ../../base

commonLabels:
  environment: production
  app.kubernetes.io/environment: production

patchesStrategicMerge:
- ingress.yaml
- hpa.yaml

images:
- name: zk-identity/go-backend
  newTag: production
- name: zk-identity/rust-proxy
  newTag: production
- name: zk-identity/frontend
  newTag: production
- name: zk-identity/julia-analysis
  newTag: production
- name: zk-identity/risc-zero-prover
  newTag: production
- name: zk-identity/noir-prover
  newTag: production
- name: zk-identity/agent-service
  newTag: production
- name: zk-identity/mcp-server
  newTag: production

patches:
- target:
    kind: Deployment
    name: go-backend
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 500m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 512Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 2Gi
- target:
    kind: Deployment
    name: rust-proxy
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 500m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 512Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 1Gi
- target:
    kind: Deployment
    name: frontend
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 200m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 256Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 500m
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 512Mi
- target:
    kind: Deployment
    name: julia-analysis
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 2Gi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 4
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 8Gi
- target:
    kind: Deployment
    name: risc-zero-prover
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 4Gi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 8
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 16Gi
- target:
    kind: Deployment
    name: noir-prover
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 2Gi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 4
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 8Gi
- target:
    kind: Deployment
    name: agent-service
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 500m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 512Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 2
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 1Gi
- target:
    kind: Deployment
    name: mcp-server
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 500m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 512Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 1Gi
