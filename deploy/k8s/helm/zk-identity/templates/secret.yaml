apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zk-identity.fullname" . }}-secrets
  labels:
    {{- include "zk-identity.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ .Values.postgresql.auth.password | default "" | b64enc | quote }}
  jwt-secret: {{ .Values.global.jwtSecret | default "" | b64enc | quote }}
  {{- if .Values.redis.auth.enabled }}
  redis-password: {{ .Values.redis.auth.password | default "" | b64enc | quote }}
  {{- end }}
