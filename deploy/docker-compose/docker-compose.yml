version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zkidentity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-zk_device_identity}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkidentity"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  go-backend:
    build:
      context: ../..
      dockerfile: images/go-backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      GO_ENV: ${GO_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-zkidentity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-zk_device_identity}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      NOIR_PROVER_URL: http://noir-prover:3001
      RISC0_PROVER_URL: http://risc-zero-prover:3002
      JULIA_ANALYSIS_URL: http://julia-analysis:8090
      AGENT_SERVICE_URL: http://agent-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  rust-proxy:
    build:
      context: ../..
      dockerfile: images/rust-proxy.Dockerfile
    ports:
      - "443:443"
      - "8081:8081"
    environment:
      PROXY_PORT: 443
      GO_BACKEND_URL: http://go-backend:8080
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      RUST_LOG: info
    depends_on:
      - go-backend
      - redis

  noir-prover:
    build:
      context: ../..
      dockerfile: images/noir-prover.Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ../../circuits:/app/circuits

  risc-zero-prover:
    build:
      context: ../..
      dockerfile: images/risc-zero.Dockerfile
    ports:
      - "3002:3002"

  julia-analysis:
    build:
      context: ../..
      dockerfile: images/julia-analysis.Dockerfile
    ports:
      - "8090:8090"

  frontend:
    build:
      context: ../..
      dockerfile: images/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - go-backend

  agent-service:
    build:
      context: ../..
      dockerfile: images/agent.Dockerfile
    ports:
      - "8000:8000"
    environment:
      GO_BACKEND_URL: http://go-backend:8080
    depends_on:
      - go-backend

  mcp-server:
    build:
      context: ../..
      dockerfile: images/mcp.Dockerfile
    ports:
      - "3003:3003"
    environment:
      GO_BACKEND_URL: http://go-backend:8080
    depends_on:
      - go-backend

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../../configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../configs/grafana-dashboards:/etc/grafana/provisioning/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_HTTP_PORT: 3001

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../../configs/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - go-backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
