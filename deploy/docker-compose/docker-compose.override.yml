version: "3.9"

services:
  go-backend:
    volumes:
      - ../../:/app
      - go-mod-cache:/go/pkg/mod
    command: ["go", "run", "./cmd/server"]
    environment:
      GO_ENV: development

  rust-proxy:
    volumes:
      - ../../rust-proxy:/app
      - cargo-cache:/usr/local/cargo/registry
    command: ["cargo", "run", "--manifest-path", "/app/Cargo.toml"]

  noir-prover:
    volumes:
      - ../../circuits:/app/circuits
      - ../../scripts:/app/scripts
    command: ["node", "--watch", "scripts/noir-prover-server.js"]

  risc-zero-prover:
    volumes:
      - ../../risc-zero:/app
      - cargo-cache:/usr/local/cargo/registry

  julia-analysis:
    volumes:
      - ../../julia-analysis:/app

  frontend:
    command: ["npm", "run", "dev"]
    volumes:
      - ../../frontend:/app
      - ../../frontend/node_modules:/app/node_modules

  agent-service:
    volumes:
      - ../../agent-service:/app
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  mcp-server:
    volumes:
      - ../../mcp-server:/app
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "3003", "--reload"]

volumes:
  go-mod-cache:
  cargo-cache:
  node-modules:
