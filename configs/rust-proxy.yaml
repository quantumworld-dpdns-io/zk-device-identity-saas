server:
  host: "0.0.0.0"
  port: 8081
  workers: 4
  max_connections: 1024
  shutdown_timeout: 30s

proxy:
  backend_url: "http://go-backend:8080"
  connect_timeout: 5s
  request_timeout: 30s
  idle_timeout: 90s
  max_buffer_size: 4096

tls:
  enabled: true
  cert_path: "/etc/certs/proxy.crt"
  key_path: "/etc/certs/proxy.key"
  min_version: "1.3"
  cipher_suites:
    - "TLS_AES_128_GCM_SHA256"
    - "TLS_AES_256_GCM_SHA384"
    - "TLS_CHACHA20_POLY1305_SHA256"
  prefer_server_cipher: true

pqc:
  enabled: true
  kem: "Kyber768"
  hybrid: true

rate_limiting:
  enabled: true
  default_rps: 100
  burst_size: 200
  per_ip: true
  per_route:
    - route: "/api/prove"
      rps: 10
      burst: 20
    - route: "/api/verify"
      rps: 50
      burst: 100
    - route: "/api/register"
      rps: 20
      burst: 40

logging:
  level: "info"
  format: "json"
  access_log: true

metrics:
  enabled: true
  path: "/metrics"

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "https://app.zkdevice.io"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Authorization"
    - "Content-Type"
    - "X-Request-ID"
  max_age: 86400
